<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complex Layout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <header class="bg-primary text-white text-center p-5">
    <h1>Welcome to Sri Webpage</h1>
  </header>

  <section class="container py-5">
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="p-4 bg-light shadow rounded transition-box">
          <h2>Left Side</h2>
          <p>I Love My Family</p>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="p-4 bg-light shadow rounded transition-box">
          <h2>Right Side</h2>
          <p>I'm intrested in AI tools</p>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-dark text-white text-center p-5">
    <h2>Full-Width Section</h2>
    <p>This spans the whole screen width.</p>
  </section>

  <footer class="bg-secondary text-white text-center p-3">
    &copy; 2025 My Website
  </footer>

</body>
</html>
